name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system deps (weasyprint)
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 \
            libffi-dev shared-mime-info

      - name: Install python deps
        run: pip install -r requirements.txt coverage

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Local accuracy regression gate
        run: python -m unittest discover -s tests -p test_scanner_lab.py -v

      - name: Coverage
        run: |
          coverage run -m unittest discover -s tests
          coverage report --fail-under=55
          coverage xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml

      - name: Structural self-test (imports, registry, config, routing)
        run: python selftest.py

      - name: Real HTTP/2 integration lab
        run: python -m unittest discover -s tests -p test_http2_lab.py -v

      - name: Local resource regression gate
        run: python -m bench.resource_gate

  browser-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies and Chromium
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Require browser capabilities and execute integration tests
        run: |
          python -c "from core.readiness import _check_browser; r = _check_browser({}); print(r); assert r['status'] == 'ok'"
          python -c "import unittest; suite = unittest.defaultTestLoader.discover('tests', pattern='test_browser_lab.py'); result = unittest.TextTestRunner(verbosity=2).run(suite); raise SystemExit(0 if result.wasSuccessful() and not result.skipped else 1)"
