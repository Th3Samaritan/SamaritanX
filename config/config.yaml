# =====================================================================
# SamaritanX — default configuration
# Override at runtime via CLI flags or a custom --config file.
# =====================================================================

profiles:
  fast:                        # broad + quick — first pass on a program
    stealth: {rate_limit_rps: 12, per_host_rps: 6}
    crawler: {max_depth: 2}
    scanners:
      skip: [smuggling, h2_smuggling, websocket, stored_xss, dom_xss,
             oauth, prompt_injection, prototype_pollution]
      nuclei: false
  deep:                        # everything, slowly, deeper
    stealth: {rate_limit_rps: 4, per_host_rps: 2}
    crawler: {max_depth: 5, max_urls_per_host: 3000}
  stealth:                     # minimal footprint
    stealth: {rate_limit_rps: 1.5, per_host_rps: 0.7, jitter_ms: [500, 2000]}
    crawler: {max_depth: 2}
    recon: {permutations: false, vhost_brute: false, zone_transfer: false}

operator:
  handle: th3Samaritan
  contact: ai@technoguard.tech

workspace:
  root: ./workspace            # all per-target output goes here
  keep_raw_tool_output: true

http:
  user_agents:
    - "Mozilla/5.0 (X11; Linux x86_64; rv:128.0) Gecko/20100101 Firefox/128.0"
    - "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
    - "Mozilla/5.0 (Macintosh; Intel Mac OS X 14_4) AppleWebKit/605.1.15 Version/17.4 Safari/605.1.15"
  timeout: 20
  max_redirects: 5
  verify_tls: false
  default_headers:
    Accept: "*/*"
    Accept-Language: "en-US,en;q=0.9"

stealth:
  enabled: true
  rate_limit_rps: 6              # global cap (requests/second)
  per_host_rps: 2                # per-host cap
  jitter_ms: [80, 350]           # random delay between requests
  rotate_user_agent: true
  rotate_referer: true

proxy:
  enabled: false
  url: ""                        # e.g. socks5h://127.0.0.1:9050 for Tor
  tor: false                     # convenience flag — uses 127.0.0.1:9050
  rotation: []                   # list of proxy URLs — round-robined per request
                                 # (cookies re-synced across the pool). --proxy
                                 # also accepts comma-separated URLs.

waf_evasion:
  enabled: true
  techniques:
    - case_swap
    - comment_injection
    - unicode_encoding
    - double_url_encoding
    - encoding_chain          # URL -> Unicode -> HTML entity (3 stages)
    - utf8_overlong           # over-long UTF-8 of <, >, ", '
    - parameter_pollution
    - chunked_transfer
  transport_mutations: true   # scanners may try multipart/JSON-in-GET/h2 pseudo-header tricks

concurrency:
  recon_workers: 8
  crawler_workers: 4
  scanner_workers: 12
  browser_contexts: 2

safety:
  aggressive: false   # destructive checks (auth lockout probe, 25x race POSTs,
                      # pricing-tamper submits). Enable only on authorized targets.

scan:
  task_timeout_seconds: 60          # per-scanner task cap (snappy)
  long_phase_timeout_seconds: 600   # recon/crawl/discover budget (fan-out phases)
  deadline_seconds: 0               # 0 = no global wall-clock limit
  incremental: true                 # skip re-scanning endpoints whose content hash
                                    # hasn't changed since the last completed scan
  revalidate_cap: 150               # max findings re-fired per run (bounded phase2)

recon:
  passive_only: false
  subfinder: true
  subfinder_timeout: 120        # seconds; process is killed if it overruns
  amass: true
  amass_timeout: 180            # seconds; process is killed if it overruns
  resolve_dns: true
  max_probe_hosts: 750          # cap live-probe set after DNS resolution
  probe_timeout: 8              # per-host HTTP probe timeout (seconds)
  probe_retries: 1              # retry transient probe timeouts before giving up
  port_scan: false              # toggle on for in-scope authorized targets
  zone_transfer: true           # attempt AXFR against the root's nameservers
  tech_fingerprint: true
  detect_wildcard: true         # resolve random names to spot *.root zones
  permutations: true            # alt-dns style subdomain mutations (bounded)
  vhost_brute: true             # fuzz Host headers against the resolved IP
  vhost_words: 60               # words tried for vhost discovery
  vhost_cap: 25                 # max distinct vhosts emitted per run
  keyed_sources: true           # Shodan/VirusTotal/SecurityTrails enrichment
                                # when SHODAN_API_KEY / VT_API_KEY /
                                # SECURITYTRAILS_API_KEY are set

crawler:
  max_depth: 3
  max_urls_per_host: 1500
  parse_javascript: true
  follow_subdomains: true
  honor_robots: false           # bug bounty hunters typically ignore robots
  extract_secrets: true
  api_discovery: true           # probe OpenAPI/Swagger specs -> typed injection points
  mine_javascript: true         # mine JS bundles for endpoints + params (SPA/API targets)

scanners:
  enabled:
    - sqli
    - lfi                  # in-band /etc/passwd + php://filter chain
    - xss                  # context-aware reflected XSS
    - stored_xss           # multi-step inject -> crawl -> verify in browser
    - dom_xss
    - ssrf
    - idor
    - idor_deep            # only fires when --second-session is set
    - csrf
    - upload
    - open_redirect
    - cors
    - cache_poisoning
    - rce
    - api
    - prompt_injection
    - smuggling            # HTTP/1.1 CL.TE / TE.CL
    - h2_smuggling         # HTTP/2 CRLF in pseudo-headers, CONTINUATION abuse, h2c upgrade
    - websocket            # CSWH + message-level SQLi/RCE/SSTI injection
    - oauth
    - graphql
    - crlf
    - host_header          # Host / X-Forwarded-Host reflection (reset-link/SSO poisoning primitive)
    - hpp                  # HTTP parameter pollution (duplicate / array parsing)
    - path_normalization   # 401/403 bypass via URL-parser discrepancies
    - security_headers     # missing HSTS/CSP/XFO/nosniff etc. + banner disclosure
    - xxe
    - deserialization
    - version_bypass
    - jwt_priv_esc
    - nosqli                # MongoDB/CouchDB operator injection + auth bypass
    - web_cache_deception   # private response cached publicly (self-escalating)
    - account_takeover      # reset poisoning, token leak, user enumeration
    - param_miner           # Arjun-style hidden parameter discovery
    - prototype_pollution   # client-side (browser-confirmed) + server-side
  nuclei: true
  nuclei_severity: "low,medium,high,critical"

oob:
  prefer_local: false       # set true to skip interactsh handshake
  server: oast.fun
  local_server: oob.local.invalid

discovery:
  enabled: true
  ffuf: true                # use ffuf if installed
  wayback: true
  cloud_buckets: true
  github_dorks: true
  openapi: true

logic_analysis:
  enabled: true
  test_auth_flows: true
  test_idor: true
  test_privilege_escalation: true

authz:
  enabled: true
  max_endpoints: 120        # endpoint templates tested across identities per host

monitor:
  enabled: false            # set true (or pass --monitor) to baseline + diff each run
  webhook: ""               # optional POST URL for new-surface alerts (Slack/Discord/etc.)
  keep_diffs: 30            # retain only the newest N diff artifacts (0 = keep all)

notify:
  enabled: false            # structured alerts across channels (all optional)
  on: ["new_findings", "new_surface", "scan_complete"]
  slack_webhook: "{ENV:SX_SLACK_WEBHOOK}"
  discord_webhook: "{ENV:SX_DISCORD_WEBHOOK}"
  telegram:
    bot_token: "{ENV:SX_TG_BOT_TOKEN}"
    chat_id: "{ENV:SX_TG_CHAT_ID}"

reporting:
  format: ["markdown", "pdf"]
  include_walkthrough: true
  cvss_baseline: 5.0

memory:
  db_path: ./workspace/.samaritanx.sqlite
  remember_payloads: true
  remember_findings: true

llm:
  enabled: false                # toggle for AI-assisted reasoning
  provider: "anthropic"         # anthropic | openai | deepseek | openai_compatible
  model: "claude-sonnet-5"      # set for your provider (deepseek -> deepseek-chat)
  api_key: "{ENV:ANTHROPIC_API_KEY}"   # or DEEPSEEK_API_KEY / OPENAI_API_KEY
                                # (any {ENV:NAME} or literal key; never commit keys)
  base_url: ""                  # for openai_compatible (Groq/OpenRouter/Ollama/vLLM) —
                                # e.g. https://api.groq.com/openai/v1

hackerone:
  enabled: false                # auto-create DRAFT reports (never publishes)
  api_token: "{ENV:H1_API_TOKEN}"
  username: "th3Samaritan"      # required by the HackerOne API (User-Agent)
  program: ""                   # optional program handle to attach drafts to
  weak_only: false              # only draft non-critical findings for review
